name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load deployment manifest
        run: |
          node --input-type=module <<'EOF' >> "$GITHUB_ENV"
          import { readFileSync } from "node:fs";

          const deployment = JSON.parse(readFileSync("deployments/shannon.json", "utf8"));
          if (!deployment.canvas?.address || !deployment.reactor?.address) {
            throw new Error("deployments/shannon.json is missing canvas/reactor addresses");
          }

          const lines = [
            `VITE_SOMNIA_CHAIN_ID=${deployment.network.chainId}`,
            `VITE_SOMNIA_RPC_URL=${deployment.network.rpcUrl}`,
            `VITE_SOMNIA_WS_URL=${deployment.network.wsUrl}`,
            `VITE_SOMNIA_EXPLORER_URL=${deployment.network.explorerUrl}`,
            `VITE_SOMNIA_PLACE_ADDRESS=${deployment.canvas.address}`,
            `VITE_SOMNIA_REACTOR_ADDRESS=${deployment.reactor.address}`,
            `VITE_CANVAS_WIDTH=${deployment.canvas.width}`,
            `VITE_CANVAS_HEIGHT=${deployment.canvas.height}`,
            `VITE_PALETTE_SIZE=${deployment.canvas.paletteSize}`
          ];

          process.stdout.write(`${lines.join("\n")}\n`);
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
