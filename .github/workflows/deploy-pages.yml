name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SOMNIA_CHAIN_ID: "50312"
      VITE_SOMNIA_RPC_URL: "https://dream-rpc.somnia.network"
      VITE_SOMNIA_WS_URL: "wss://dream-rpc.somnia.network/ws"
      VITE_SOMNIA_EXPLORER_URL: "https://shannon-explorer.somnia.network"
      VITE_SOMNIA_PLACE_ADDRESS: ${{ vars.VITE_SOMNIA_PLACE_ADDRESS }}
      VITE_SOMNIA_REACTOR_ADDRESS: ${{ vars.VITE_SOMNIA_REACTOR_ADDRESS }}
      VITE_CANVAS_WIDTH: ${{ vars.VITE_CANVAS_WIDTH }}
      VITE_CANVAS_HEIGHT: ${{ vars.VITE_CANVAS_HEIGHT }}
      VITE_PALETTE_SIZE: ${{ vars.VITE_PALETTE_SIZE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
